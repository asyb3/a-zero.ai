<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>a-zero.ai</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style id="az-style">
  :root {
    --ground: #FAFAFB;
    --surface: #F1F2F4;
    --surface-2: #E9EAED;
    --ink: #17191D;
    --ink-soft: #40444C;
    --muted: #868B93;
    --line: #E3E4E8;
    --line-strong: #D2D4DA;
    --accent: #6F7D75;
    --accent-soft: #8A978F;
    --band: #2A2D33;
    --band-ink: #EDEEF0;
    --band-muted: #9CA2AA;
    --band-line: #3A3E45;

    --f-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
    --f-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

    --wrap: 1080px;
    --step--1: clamp(0.78rem, 0.75rem + 0.15vw, 0.86rem);
    --step-0: clamp(1rem, 0.96rem + 0.2vw, 1.12rem);
    --step-1: clamp(1.2rem, 1.1rem + 0.5vw, 1.5rem);
    --step-2: clamp(1.6rem, 1.35rem + 1.2vw, 2.4rem);
    --step-3: clamp(2.4rem, 1.9rem + 2.6vw, 4.2rem);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E0F12;
      --surface: #16181C;
      --surface-2: #1C1F24;
      --ink: #ECEDEF;
      --ink-soft: #B4B8BF;
      --muted: #7C818A;
      --line: #23262B;
      --line-strong: #2E3138;
      --accent: #93A29A;
      --accent-soft: #7E8C84;
      --band: #1A1D22;
      --band-ink: #ECEDEF;
      --band-muted: #878D96;
      --band-line: #2B2F36;
    }
  }
  :root[data-theme="light"] {
    --ground: #FAFAFB; --surface: #F1F2F4; --surface-2: #E9EAED; --ink: #17191D;
    --ink-soft: #40444C; --muted: #868B93; --line: #E3E4E8; --line-strong: #D2D4DA;
    --accent: #6F7D75; --accent-soft: #8A978F; --band: #2A2D33; --band-ink: #EDEEF0;
    --band-muted: #9CA2AA; --band-line: #3A3E45;
  }
  :root[data-theme="dark"] {
    --ground: #0E0F12; --surface: #16181C; --surface-2: #1C1F24; --ink: #ECEDEF;
    --ink-soft: #B4B8BF; --muted: #7C818A; --line: #23262B; --line-strong: #2E3138;
    --accent: #93A29A; --accent-soft: #7E8C84; --band: #1A1D22; --band-ink: #ECEDEF;
    --band-muted: #878D96; --band-line: #2B2F36;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-sans);
    font-size: var(--step-0);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap { width: 100%; max-width: var(--wrap); margin-inline: auto; padding-inline: clamp(1.25rem, 5vw, 3rem); }
  [hidden] { display: none !important; }

  .eyebrow {
    font-family: var(--f-mono);
    font-size: var(--step--1);
    letter-spacing: 0.16em;
    color: var(--accent);
    margin: 0 0 1rem;
    display: inline-flex; align-items: center; gap: 0.6em;
  }
  .eyebrow::before { content: ""; width: 1.6em; height: 1px; background: var(--accent-soft); opacity: 0.7; }

  h1, h2, h3 { text-wrap: balance; font-weight: 500; letter-spacing: -0.02em; line-height: 1.08; margin: 0; }

  a { color: inherit; }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    backdrop-filter: saturate(1.2) blur(10px);
    background: color-mix(in srgb, var(--ground) 82%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; text-decoration: none; }
  .brand .mark { width: 30px; height: 22px; display: block; }
  .brand .word { font-size: 1.06rem; letter-spacing: -0.03em; font-weight: 500; color: var(--ink); }
  .brand .word .tld { color: var(--muted); }
  .nav-links { display: flex; align-items: center; gap: 1.6rem; }
  .nav-links a {
    font-family: var(--f-sans); font-size: 0.98rem; letter-spacing: -0.005em; font-weight: 450;
    color: var(--ink-soft); text-decoration: none; transition: color .2s;
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-cta {
    font-family: var(--f-sans); font-size: 0.94rem; font-weight: 450;
    padding: 0.55rem 1.1rem; border: 1px solid var(--line-strong); border-radius: 999px;
    text-decoration: none; color: var(--ink); transition: border-color .2s, background .2s;
  }
  .nav-cta:hover { border-color: var(--ink); background: var(--surface); }
  @media (max-width: 760px) { .nav-links a:not(.nav-cta) { display: none; } }

  .article-shell { max-width: 760px; margin: 0 auto; }
  .article-shell .article-kicker { font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
  .article-shell h1 { font-size: clamp(2.2rem, 1.6rem + 2.6vw, 4rem); margin-top: .8rem; }
  .article-meta { display: flex; flex-wrap: wrap; gap: 1rem 2rem; margin-top: 1.2rem; font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: .06em; color: var(--muted); }
  .article-body { margin-top: 2.2rem; color: var(--ink-soft); font-size: 1.08rem; }
  .article-body p { margin: 0 0 1.5rem; }
  .article-body h2 { color: var(--ink); font-size: clamp(1.4rem, 1.2rem + .8vw, 2rem); margin: 2.3rem 0 1rem; }
  .article-body blockquote {
    margin: 2rem 0; padding: 1.4rem 1.6rem; border-left: 2px solid var(--accent); background: var(--surface); color: var(--ink); font-size: 1.06rem;
  }
  .article-body strong { color: var(--ink); }
  .article-body ul { margin: 1.2rem 0 1.75rem; padding-left: 1.2rem; }
  .article-body li { margin-bottom: .7rem; }

  /* ---------- hero ---------- */
  .hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  .hero-grid {
    display: grid; grid-template-columns: 1.05fr 0.95fr; align-items: center; gap: 2rem;
    padding-block: clamp(3.5rem, 9vw, 7rem);
  }
  @media (max-width: 860px) { .hero-grid { grid-template-columns: 1fr; gap: 2.5rem; } }
  .hero h1 { font-size: var(--step-3); }
  .hero h1 .dim { color: var(--muted); }
  .hero p.lead {
    font-size: var(--step-1); color: var(--ink-soft); max-width: 36ch;
    margin: 1.4rem 0 2rem; line-height: 1.45; font-weight: 400;
  }
  .cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 1.1rem; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.55em;
    font-family: var(--f-sans); font-size: 0.98rem; letter-spacing: -0.005em; font-weight: 450;
    padding: 0.8rem 1.5rem; border-radius: 999px; text-decoration: none;
    background: var(--ink); color: var(--ground);
    border: 1px solid var(--ink); transition: transform .18s ease, opacity .2s; cursor: pointer;
  }
  .btn:hover { transform: translateY(-2px); opacity: 0.92; }
  .btn .arrow { transition: transform .2s ease; }
  .btn:hover .arrow { transform: translateX(3px); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn.ghost:hover { border-color: var(--ink); background: var(--surface); }

  .hero-art { position: relative; display: grid; place-items: center; min-height: 300px; }
  .hero-art svg { width: 100%; max-width: 440px; height: auto; overflow: visible; }
  .facet { transition: opacity .6s ease; }

  @keyframes glidein {
    from { opacity: 0; transform: translate(-26px, 20px) rotate(-4deg); }
    to   { opacity: 1; transform: translate(0,0) rotate(0); }
  }
  .plane-anim { animation: glidein 1.1s cubic-bezier(.2,.7,.2,1) both; transform-origin: 60% 50%; }
  @keyframes dash { to { stroke-dashoffset: 0; } }
  .trail { stroke-dasharray: 4 7; stroke-dashoffset: 260; animation: dash 1.6s ease-out .3s forwards; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .bobber { animation: bob 6s ease-in-out infinite 1.2s; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) {
    .plane-anim, .trail, .bobber { animation: none; }
    .trail { stroke-dashoffset: 0; }
  }

  .hero-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0.55; }
  .hero-bg svg { width: 100%; height: 100%; }

  /* ---------- section scaffold ---------- */
  section { padding-block: clamp(3.5rem, 8vw, 6.5rem); }
  .sec-head { max-width: 36ch; margin-bottom: clamp(2rem, 4vw, 3.2rem); }
  .sec-head h2 { font-size: var(--step-2); }
  .sec-head p { color: var(--ink-soft); margin: 1rem 0 0; }
  .bordered { border-top: 1px solid var(--line); }
  .tinted { background: var(--surface); border-block: 1px solid var(--line); }
  .track { scroll-margin-top: calc(76px + env(safe-area-inset-top, 0px)); }
  .track-head { max-width: 62ch; margin-bottom: clamp(2rem, 4vw, 3.2rem); }
  .track-head h2 { font-size: var(--step-2); max-width: 24ch; }
  .track-head p { color: var(--ink-soft); margin: 1rem 0 0; max-width: 58ch; }
  .track-head .who { margin-top: 1.7rem; }

  /* ---------- spectrum rows ---------- */
  .spec { list-style: none; margin: 0; padding: 0; }
  .spec li { border-top: 1px solid var(--line); }
  .spec .row {
    display: grid; grid-template-columns: 0.85fr 1.3fr; gap: clamp(1.2rem, 3vw, 3rem);
    align-items: start; padding-block: clamp(1.6rem, 3.5vw, 2.6rem);
    padding-inline: clamp(.6rem, 1.5vw, 1.2rem);
  }
  @media (max-width: 820px) { .spec .row { grid-template-columns: 1fr; gap: .9rem; } }
  .spec h3 { font-size: var(--step-1); margin-top: .5rem; }
  .spec .desc { color: var(--ink-soft); margin: 0; line-height: 1.55; }

  /* ---------- service page scaffold ---------- */
  .svc-hero { border-bottom: 1px solid var(--line); padding-block: clamp(3rem, 7vw, 5.5rem); }
  .svc-hero h1 { font-size: clamp(2rem, 1.6rem + 2.2vw, 3.4rem); max-width: 22ch; }
  .svc-hero p.lead { font-size: var(--step-1); color: var(--ink-soft); max-width: 54ch; margin: 1.4rem 0 0; line-height: 1.5; }
  .crumb { font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: .1em; color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: 1.4rem; }
  .crumb:hover { color: var(--ink); }
  .who { display: flex; flex-wrap: wrap; gap: 1rem 3rem; margin-top: 2rem; }
  .who div { font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: .06em; color: var(--ink-soft); }
  .who b { display: block; color: var(--accent); font-weight: 500; letter-spacing: .12em; margin-bottom: .3rem; }

  /* capability lists */
  .caps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 2rem; }
  @media (max-width: 640px) { .caps { grid-template-columns: 1fr; } }
  .caps li {
    display: flex; gap: 0.75rem; align-items: baseline;
    color: var(--ink-soft); font-size: var(--step-0); line-height: 1.5;
    border-top: 1px solid var(--line); padding-block: 0.85rem;
  }
  .caps li::before {
    content: ""; flex: none; width: 9px; height: 9px; transform: translateY(1px);
    background: var(--accent); clip-path: polygon(0 0, 100% 35%, 45% 100%);
  }
  .caps b { color: var(--ink); font-weight: 500; }

  /* card grid (consulting deliverables) */
  .offer-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  @media (max-width: 780px) { .offer-list { grid-template-columns: 1fr; } }
  .offer-item { background: var(--ground); padding: clamp(1.6rem, 3vw, 2.4rem); display: flex; flex-direction: column; gap: 0.9rem; }
  .offer-item .k { font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: 0.1em; color: var(--accent); }
  .offer-item h3 { font-size: var(--step-1); }
  .offer-item p { color: var(--ink-soft); margin: 0; font-size: var(--step-0); line-height: 1.55; }

  /* split + steps */
  .split { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: clamp(2rem, 5vw, 4.5rem); align-items: start; }
  @media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
  .split h2 { font-size: var(--step-2); max-width: 18ch; }
  .split .body p { color: var(--ink-soft); margin: 0 0 1.1rem; max-width: 60ch; }
  .split .body p:last-child { margin-bottom: 0; }
  .split .body strong { color: var(--ink); font-weight: 500; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.3rem; }
  .steps li { border-top: 1px solid var(--line); padding-top: 1.1rem; display: flex; gap: 1rem; align-items: baseline; }
  .steps li:first-child { border-top: 0; padding-top: 0; }
  .steps .n { font-family: var(--f-mono); font-size: var(--step--1); color: var(--accent); letter-spacing: .1em; white-space: nowrap; }
  .steps p { margin: 0; color: var(--ink-soft); }
  .steps b { color: var(--ink); font-weight: 500; }

  .ws-foot { margin-top: clamp(1.6rem, 3vw, 2.4rem); display: flex; flex-wrap: wrap; align-items: center; gap: 1.1rem; justify-content: space-between; color: var(--ink-soft); }

  /* case studies + referral */
  .cases { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(1.2rem, 2.5vw, 2rem); }
  @media (max-width: 780px) { .cases { grid-template-columns: 1fr; } }
  .case { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--ground); display: flex; flex-direction: column; }
  .case figure { margin: 0; aspect-ratio: 40 / 26; overflow: hidden; border-bottom: 1px solid var(--line); }
  .case figure svg { display: block; width: 100%; height: 100%; }
  .case-body { padding: clamp(1.4rem, 2.5vw, 2rem); display: flex; flex-direction: column; gap: 0.8rem; }
  .case-body .k { font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: 0.1em; color: var(--accent); }
  .case-body h3 { font-size: var(--step-1); }
  .case-body p { color: var(--ink-soft); margin: 0; line-height: 1.55; }
  .pull { margin: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: clamp(1.8rem, 4vw, 3rem); }
  .pull blockquote { margin: 0; }
  .pull blockquote p { font-size: var(--step-1); line-height: 1.6; color: var(--ink); margin: 0; max-width: 62ch; font-weight: 400; }
  .pull figcaption { margin-top: 1.4rem; font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: 0.06em; color: var(--muted); }
  .pull figcaption b { color: var(--ink-soft); font-weight: 500; }

  /* dark band */
  .band { background: var(--band); color: var(--band-ink); position: relative; overflow: hidden; }
  .band .tris { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.75; pointer-events: none;
    mask-image: linear-gradient(90deg, #000, transparent 36%, transparent 64%, #000);
    -webkit-mask-image: linear-gradient(90deg, #000, transparent 36%, transparent 64%, #000);
  }
  .band .wrap { position: relative; text-align: center; padding-block: clamp(5rem, 11vw, 8.5rem); }
  .band h2 { font-size: var(--step-2); color: var(--band-ink); max-width: 20ch; margin-inline: auto; line-height: 1.14; }
  .band p { color: var(--band-muted); max-width: 46ch; margin: 1.6rem auto 0; }

  /* about */
  .cred { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.5rem; }
  .cred li { border-top: 1px solid var(--line); padding-top: 1.3rem; }
  .cred li:first-child { border-top: none; padding-top: 0; }
  .cred-k { display: block; font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: 0.08em; color: var(--accent); margin-bottom: 0.55rem; }
  .cred li p { margin: 0; color: var(--ink-soft); line-height: 1.55; }
  .cred li strong { color: var(--ink); font-weight: 500; }
  .about-lead p { font-size: var(--step-1); line-height: 1.5; color: var(--ink-soft); margin: 0; font-weight: 400; }

  /* contact */
  .contact { text-align: center; }
  .contact .sec-head { margin-inline: auto; max-width: none; }
  .contact h2 { font-size: var(--step-3); }
  .contact p { color: var(--ink-soft); max-width: 44ch; margin: 1.1rem auto 2rem; }

  /* footer */
  footer { border-top: 1px solid var(--line); }
  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 2.2rem; }
  .foot .fbrand { display: inline-flex; align-items: center; gap: 0.55rem; }
  .foot .fbrand .word { font-size: 0.98rem; letter-spacing: -0.03em; }
  .foot .fbrand .word .tld { color: var(--muted); }
  .foot .meta { font-family: var(--f-sans); font-size: 0.92rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: center; }
  .foot .meta a { color: var(--ink-soft); text-decoration: none; }
  .foot .meta a:hover { color: var(--ink); }
  /* ---------- in-place editor ---------- */
  .az-editing { padding-block-end: 132px; }
  .az-editing [data-az-edit] { cursor: text; outline: 1px dashed transparent; outline-offset: 4px; border-radius: 2px; transition: outline-color .15s; }
  .az-editing [data-az-edit]:hover { outline-color: var(--accent-soft); }
  .az-editing [data-az-edit]:focus { outline: 2px solid var(--accent); outline-offset: 4px; }
  .az-editing .band [data-az-edit]:hover { outline-color: var(--band-muted); }
  .az-editing .band [data-az-edit]:focus { outline-color: var(--band-ink); }
  .az-editing [data-az-edit]:empty { padding-inline: 1ch; outline-color: var(--accent-soft); }
  .az-editing a { cursor: text; }
  .az-editing .btn:hover, .az-editing .btn:hover .arrow { transform: none; }

  .az-pill, .az-bar, .az-toast {
    position: fixed; z-index: 60; font-family: var(--f-sans); color-scheme: dark;
    background: var(--band); color: var(--band-ink); border: 1px solid var(--band-line);
    box-shadow: 0 18px 48px -18px rgba(0, 0, 0, .55);
  }
  .az-pill {
    right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: inline-flex; align-items: center; gap: .55rem;
    padding: .6rem 1.05rem; border-radius: 999px; font-size: .92rem; font-weight: 450; cursor: pointer;
  }
  .az-pill:hover { border-color: var(--band-muted); }
  .az-badge { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .04em; padding: .12rem .5rem; border-radius: 999px; background: var(--band-ink); color: var(--band); }
  .az-bar {
    left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: calc(100% - 32px); padding: .55rem .6rem .5rem; border-radius: 16px;
  }
  .az-row { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; }
  .az-field { display: inline-flex; align-items: center; gap: .45rem; padding-left: .4rem; }
  .az-lbl { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .12em; color: var(--band-muted); }
  #az-view { font: inherit; font-size: .88rem; color: var(--band-ink); background: var(--band); border: 1px solid var(--band-line); border-radius: 8px; padding: .3rem .45rem; cursor: pointer; }
  .az-sep { width: 1px; align-self: stretch; margin: .2rem .3rem; background: var(--band-line); }
  .az-fmt { min-width: 2.1rem; height: 2.1rem; padding: 0 .5rem; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--band-ink); font: inherit; font-size: .95rem; cursor: pointer; }
  .az-fmt:hover { border-color: var(--band-line); }
  .az-fmt-word { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .06em; color: var(--band-muted); }
  .az-fmt-word:hover { color: var(--band-ink); }
  .az-status { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .05em; color: var(--band-muted); padding: 0 .45rem; max-width: 36ch; }
  .az-status.is-dirty { color: var(--band-ink); }
  .az-btn { font: inherit; font-size: .88rem; font-weight: 450; padding: .45rem .95rem; border-radius: 999px; border: 1px solid var(--band-line); cursor: pointer; white-space: nowrap; }
  .az-ghost { background: transparent; color: var(--band-ink); }
  .az-ghost:hover { border-color: var(--band-muted); }
  .az-primary { background: var(--band-ink); color: var(--band); border-color: var(--band-ink); }

<section id="report-data-security" class="bordered">
  <section class="svc-hero">
    <div class="wrap article-shell">
      <a class="crumb" href="#/">← a-zero.ai</a>
      <div class="article-kicker">article 01 · data security</div>
      <h1>The changing landscape of data security in the age of AI.</h1>
      <div class="article-meta">
        <span>october 2026</span>
        <span>by a-zero.ai</span>
        <span>7 min read</span>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap article-shell article-body">
      <p>AI is changing the architecture of the enterprise. A company is no longer just a collection of teams and assets; it is a system of knowledge, decisions, permissions, and trust. When AI compresses the time between insight and action, the assumptions that once governed data protection and strategic advantage begin to fray.</p>

      <p>This is unmistakably visible in the changing landscape of data security. The traditional model assumed that valuable information could be protected through access controls, legal frameworks, and the opacity of internal operations. That assumption is increasingly fragile. Intellectual property is harder to defend, competitors can study behavior more efficiently, and product patterns are more easily reverse engineered than before. The market is forcing a stark reality: advantage is determined less by what a company possesses than by how quickly it can adapt, govern, and reconfigure its own operating system.</p>

      <p>That is why data governance is no longer a compliance issue. It is a strategic discipline. As AI accelerates the rate of change, businesses must decide which knowledge is genuinely proprietary, which systems should be exposed to AI, which decisions must remain human, and how to operationalize those boundaries without slowing the organization below market and 'security' speed.</p>

      <blockquote>
        “The security landscape is shifting faster than ever — enterprises are under attack from a growing range of sources, while many are still using old models of protection that no longer match today’s threat environment.”
        <br><br>
        — IBM Security, on the accelerating need to update enterprise security strategy in the AI era.
      </blockquote>

      <p>IBM’s framing is useful because it points to a broader truth: security is no longer just about preventing intrusion. It is about protecting the integrity of the operating context itself. In a world where AI can analyze patterns, synthesize capabilities, and accelerate reverse engineering, the real question is not just whether information is protected. It is whether the company has a defensible way to decide what matters, how it is accessed, and how it is transformed into advantage.</p>

      <h2>AI is accelerating the decay of old strategic assumptions</h2>

      <p>Many organizations still think in terms of product differentiation, process advantages, and proprietary knowledge as if they were stable assets. But AI is changing the rate at which those advantages can be copied, decomposed, and reassembled. The market is increasingly defined by a wave of <strong>decomposition</strong>: capabilities once embedded inside a company’s workflows are becoming inspectable, portable, and replicable at scale. That does not make every competitive advantage obsolete. It changes where advantage resides.</p>

      <p>What becomes valuable is not simply “having the secret.” It is the ability to <strong>structure the business intelligently</strong>: to organize knowledge, define decision rights, govern data access, and design the workflows that allow AI to create value without eroding trust. In a market where IP is harder to contain and competitors can move quickly, strategic advantage increasingly comes from the quality of the operating system behind the business.</p>

      <h2>Data security is no longer the perimeter problem — it is the business design problem</h2>

      <p>Many companies are still optimizing for the old model of security: lock down systems, restrict access, deploy controls, and hope the internal environment remains hard to navigate. But AI changes the operating equation. The decisions that matter are now split across data access, workflow design, tool selection, retrieval architecture, and governance rules. If those parts are not designed deliberately, AI becomes either unsafe or strategically shallow. It becomes a risk multiplier.</p>

      <ul>
        <li>What data is classified as decision-critical versus merely accessible?</li>
        <li>Which workflows are safe to augment with AI, and which require human authority?</li>
        <li>Which tools genuinely create leverage versus create exposure?</li>
        <li>How do you preserve strategic integrity while enabling speed?</li>
      </ul>

      <p>The companies that win will not be the ones with the most dashboards or the most AI experiments. They will be the ones that make decisive data-management choices early — and that understand the current rate of change as a structural challenge to their business model, not simply a technical implementation challenge.</p>

      <h2>Strategy has to move faster than the market</h2>

      <p>The real shift is this: businesses can no longer assume that competitive advantage is protected by opacity alone. The current market conditions demand operational clarity. They require a sharper understanding of where value is created, what truly must remain private, what should be systemized, and how AI can improve decision quality without eroding trust.</p>

      <p>That is the leadership challenge now. AI is not a mere tool; it is an accelerant. When the market changes this quickly, slow governance becomes a strategic liability. New business strategies are required: clearer ownership, more deliberate data management, tighter operational mapping, and stronger alignment between intelligence and execution. New businesses need to be more agile than ever.</p>

      <p>In other words, the business must reorganize itself around the fact that AI is changing the operating environment. The question is no longer whether the organization will adapt. It is whether it will adapt in a way that protects its strategic position while capturing the opportunity created by the new market conditions.</p>
    </div>
  </section>
</section>

    <div class="wrap article-shell article-body">
      <p>Capabilities that once required separate applications are consolidating into general-purpose models. Writing, research, analysis, light design, and a growing share of workflow orchestration can now be done inside one interface. This is a drastic change in the software market, and it is must be treated as an urgent operational question: which of the tools an organization relies on are becoming interchangeable, which are not, and what that means for the information flowing through them.</p>

      <h2>What is being compressed</h2>

      <p>The clearest signal is in orchestration. Services such as Zapier and n8n connect applications through predefined triggers and steps. Tool protocols such as MCP let a model call external services directly. As models get better at following context and carrying out multi-step tasks, some of the orchestration that needed a visual workflow can be expressed as an instruction to a model. The same applies to features that are easy to describe: summarize this, draft that, extract these fields. A feature that can be stated in a sentence can often be reproduced in a sentence.</p>

      <p>Two consequences follow. Prompt engineering has stopped being a distinct skill; clear instructions, well-designed context, and evaluation have not. And retrieval-augmented generation is no longer needed for small, stable collections that fit reliably in context, though it remains the right pattern for large, changing, permission-sensitive corpora where provenance matters.</p>

      <h2>What is not</h2>

      <p>Model capability is not product replacement. Established software provides records, permissions, audit trails, predictable behavior, support, and accountability. A model can reproduce a feature without reproducing any of that. A word processor gaining a natural-language interface is a change in interface, not evidence that the product or its market has gone.</p>

      <p>Software advantages are being repriced. Features are more exposed. Durable value sits in distribution, trusted relationships, domain expertise, regulatory capability, reliable execution, and information that competitors cannot reproduce and that can be used lawfully. Workflow platforms lose some surface-level use cases and keep their value as integration, monitoring, and control layers.</p>

      <h2>What it means for the data you hold</h2>

      <p>If features are becoming cheap and governed information is not, the practical question is which information an organization holds that qualifies. Not all of it does. Volume is not a moat. Information is an asset when it is distinctive, accurate, current, legally usable, and connected to decisions or operations that matter. The same information becomes a liability when ownership is unclear, access is broader than it needs to be, retention is uncontrolled, or sensitive material reaches systems without suitable protections.</p>

      <p>More capable models also change the analysis on both sides: they assist defensive review, and they lower the cost of finding weaknesses. That does not mean every organization faces an imminent incident. It means exposure should be assessed on the data actually held, the systems it moves through, and the consequences of its loss or misuse, rather than on general sentiment about AI.</p>

      <h2>A working sequence</h2>

      <ul>
        <li>Inventory the information that supports differentiation: operational knowledge, customer relationships, research, processes.</li>
        <li>Record where each category lives, who owns it, who can reach it, and under which terms it may be used.</li>
        <li>Trace the routes by which it reaches AI tools and third-party services: prompts, uploads, integrations, fine-tuning, logs.</li>
        <li>Evaluate tools on what they retain and expose, not only on what they can do. Records, permissions, logging, and failure handling matter more than feature lists.</li>
        <li>Keep retrieval systems and workflow platforms where scale, change, permissions, or citations require them. Let them go where a well-specified instruction does the job.</li>
        <li>Set protection proportionate to sensitivity, legal obligation, competitive value, and the cost of loss. Restricting everything restricts useful work.</li>
      </ul>

      <h2>Four claims, tested</h2>

      <ul>
        <li><strong>“RAG is obsolete.”</strong> Overstated. Large, dynamic, permissioned, or citation-dependent collections still need search and access control.</li>
        <li><strong>“Workflow tools are finished.”</strong> Some workflows will collapse into model-native interaction. Production systems still need integration, observability, permissions, failure handling, and repeatability.</li>
        <li><strong>“Protect everything.”</strong> No organization can remove all exposure without also restricting useful work.</li>
        <li><strong>“Proprietary data guarantees a moat.”</strong> Only if it is accurate, usable, and governed. Otherwise it is mostly risk.</li>
      </ul>

      <p>The objective is deliberate control rather than maximum restriction: protect the information whose loss would materially weaken the organization, and keep the ability to learn, operate, and adapt. As software features become easier to reproduce, this kind of data governance is part of strategy, not an administrative step added after deployment.</p>
    </div>
  </section>
</section>
<section id="report-agentic" class="bordered">
  <section class="svc-hero">
    <div class="wrap article-shell">
      <a class="crumb" href="#/">← a-zero.ai</a>
      <div class="article-kicker">article 03 · agentic security</div>
      <h1>Why agents leak data: a review of the network principles they break.</h1>
      <div class="article-meta">
        <span>october 2026</span>
        <span>by a-zero.ai</span>
        <span>6 min read</span>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap article-shell article-body">
      <p>An agent is a program that reads untrusted input, holds credentials, and makes network requests chosen at runtime by a model. Each of those is familiar to network security. Combined, they break principles the field settled decades ago. Most agent data leaks are not novel attacks. They are old failure modes, reintroduced by architecture.</p>

      <h2>The core problem: no separation of control and data</h2>

      <p>Telephone networks once carried control signals in the same channel as the voice, and anyone who could play the right tone could control the switch. The fix was out-of-band signalling. Language models are in-band by construction: instructions and data arrive as the same tokens. A web page, an email, a PDF, or a tool result can contain text the model treats as an instruction. This is prompt injection, and it ranks first in the OWASP Top 10 for LLM Applications. No reliable model-level filter exists. It has to be contained architecturally.</p>

      <p>The containment rule is best stated as a combination to avoid. An agent becomes an exfiltration path when one session has all three of:</p>

      <ul>
        <li><strong>Access to private data</strong>: files, mailboxes, databases, internal tools.</li>
        <li><strong>Exposure to untrusted content</strong>: web pages, inbound email, shared documents, third-party tool output.</li>
        <li><strong>A way to communicate outward</strong>: HTTP requests, sending messages, opening pull requests, even rendering an image URL.</li>
      </ul>

      <p>Remove any one and injected instructions have nowhere to take the data. This combination is often called the lethal trifecta.</p>

      <h2>Seven patterns that make agents unsafe</h2>

      <ul>
        <li><strong>Unrestricted egress.</strong> An agent that can fetch any URL can send data anywhere: in a query string, a request body, a DNS lookup, or a Markdown image the client renders automatically. Default-allow outbound traffic is the most common leak path.</li>
        <li><strong>Ambient, over-scoped credentials.</strong> Long-lived tokens with broad scopes, often a shared service account, let any injected instruction act with the agent's full authority. This is the confused-deputy problem: the agent is authorized, the intent is not.</li>
        <li><strong>Server-side request forgery.</strong> A fetch tool running inside the network can reach what the user cannot: internal admin panels, unauthenticated services, and the cloud metadata endpoint at 169.254.169.254, which can hand out instance credentials.</li>
        <li><strong>Implicit trust in local services.</strong> Tool servers bound to 0.0.0.0, or to localhost without checking the Host and Origin headers, are reachable by other machines or by any web page through DNS rebinding.</li>
        <li><strong>Flat trust between tools.</strong> Tool descriptions are read by the model, so a malicious or compromised tool server can instruct the agent to misuse other tools. Servers can also change their tool definitions after approval. Combining several tool servers in one session joins their trust domains.</li>
        <li><strong>Secrets in the context window.</strong> API keys pasted into prompts, environment dumps, and verbose tool output put credentials where an injected instruction can read them back, and into logs and traces held by third parties.</li>
        <li><strong>No audit or limits.</strong> Tool calls that are not logged with their inputs and outputs cannot be investigated. Without rate limits or a kill switch, a misdirected agent runs until someone notices.</li>
      </ul>

      <h2>Principles to hold to</h2>

      <ul>
        <li><strong>Deny egress by default.</strong> Route agent traffic through a proxy with a domain allowlist. Block private address ranges and metadata endpoints. Do not auto-render images or links from model output.</li>
        <li><strong>Break the trifecta per session.</strong> A session that reads untrusted content should not hold private data and an outbound channel at the same time. Split the work across agents with different permissions, and pass only structured, validated data between them.</li>
        <li><strong>Least privilege, short-lived credentials.</strong> Scope tokens to the task and the user, not to the agent platform. Expire them in minutes, not months.</li>
        <li><strong>Keep secrets out of the model.</strong> Inject credentials at the proxy or tool layer so the model never sees them.</li>
        <li><strong>Authenticate every hop.</strong> Use OAuth or mTLS between agents and tool servers. Bind local servers to loopback and validate Host and Origin.</li>
        <li><strong>Pin and review tools.</strong> Treat tool servers as dependencies: pin versions, review descriptions, alert on changes, and isolate untrusted servers in separate sessions.</li>
        <li><strong>Require approval for consequential actions.</strong> Sending data out, deleting, paying, or changing permissions should wait for a human, shown the exact action and payload.</li>
        <li><strong>Log, limit, contain.</strong> Record every tool call. Rate-limit actions. Run agents in sandboxed environments with no lateral network reach, and keep a way to stop them.</li>
      </ul>

      <h2>Where to start</h2>

      <p>Inventory every agent and AI integration in use, including those adopted informally. For each, record what data it can read, what untrusted content it ingests, and where it can send traffic. Any entry with all three is the first priority. Most of the fix is ordinary network discipline applied to a new kind of client: deny by default, scope tightly, authenticate everything, and log what happens.</p>
    </div>
  </section>

    var sel = window.getSelection();
    var i = hostIndex(sel && sel.anchorNode);
    if (i < 0) { say("Select some text first."); return; }
    document.execCommand(cmd, false, null);
    markDirty(i);
  }
  function discard(btn) {
    if (!count()) return;
    if (!discardTimer) {
      btn.textContent = "Discard " + count() + "?";
      discardTimer = setTimeout(function () { discardTimer = null; btn.textContent = "Discard"; }, 3000);
      return;
    }
    clearTimeout(discardTimer);
    discardTimer = null;
    btn.textContent = "Discard";
    Object.keys(dirty).forEach(function (i) { live[i].innerHTML = twins[i].innerHTML; });
    dirty = {};
    clearStash();
    refresh();
  }

  function wire() {
    document.addEventListener("input", function (e) {
      if (editing) markDirty(hostIndex(e.target));
    }, true);
    document.addEventListener("keydown", function (e) {
      if (!editing) return;
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "s" || e.key === "S")) { e.preventDefault(); save(); return; }
      var i = hostIndex(e.target);
      if (i < 0) return;
      if (e.key === "Enter") {
        e.preventDefault();
        if (e.shiftKey) { if (!document.execCommand("insertLineBreak")) document.execCommand("insertHTML", false, "<br>"); }
        else live[i].blur();
      } else if (e.key === "Escape") {
        live[i].blur();
      }
    }, true);
    document.addEventListener("paste", function (e) {
      if (!editing || hostIndex(e.target) < 0) return;
      e.preventDefault();
      var text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
      document.execCommand("insertText", false, text.replace(/\s*[\r\n]+\s*/g, " "));
    }, true);
    document.addEventListener("click", function (e) {
      if (!editing || ui.bar.contains(e.target)) return;
      var a = e.target.closest && e.target.closest("a[href]");
      if (a) { e.preventDefault(); e.stopPropagation(); } /* while editing, clicking a link edits its text */
    }, true);
    function noDrag(e) { if (editing) e.preventDefault(); }
    document.addEventListener("dragstart", noDrag, true);
    document.addEventListener("drop", noDrag, true);
  }

  /* ---------- saving: serve.mjs writes index.html in place, then we reload to it ---------- */
  function save() {
    if (!editing || !count()) return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    var html;
    try { html = buildDocument(); } catch (e) { say("Couldn't assemble the page. Nothing was saved."); return; }
    say("Saving…");
    fetch(location.pathname, { method: "PUT", body: html }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      stash(true);
      location.reload();
    }).catch(function () {
      stash(false);
      say("Couldn't save. Is serve.mjs still running? Your edits are kept here, so try again.");
    });
  }

  /* ---------- keeping unsaved edits across a reload (this tab only) ---------- */
  function stashSoon() { clearTimeout(stashTimer); stashTimer = setTimeout(function () { stash(false); }, 400); }
  function stash(pending) {
    clearTimeout(stashTimer);
    try {
      var edits = Object.keys(dirty).map(function (i) {
        return { i: +i, orig: twins[i].textContent, html: clean(live[i]) };
      });
      if (!edits.length) { sessionStorage.removeItem(STASH); return; }
      sessionStorage.setItem(STASH, JSON.stringify({ pending: !!pending, edits: edits }));
    } catch (e) {}
  }
  function clearStash() {
    clearTimeout(stashTimer);
    try { sessionStorage.removeItem(STASH); } catch (e) {}
  }
  function toast(msg) {
    var t = h("div", { "class": "az-toast", role: "status" });
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 4500);
  }
  function offer(msg, onYes, onNo) {
    var t = h("div", { "class": "az-toast", role: "alertdialog", "aria-label": "Unsaved edits" });
    var span = document.createElement("span");
    span.textContent = msg;
    var yes = h("button", { type: "button", "class": "az-btn az-primary" });
    yes.textContent = "Restore";
    var no = h("button", { type: "button", "class": "az-btn az-ghost" });
    no.textContent = "Dismiss";
    t.appendChild(span); t.appendChild(yes); t.appendChild(no);
    document.body.appendChild(t);
    yes.addEventListener("click", function () { t.remove(); onYes(); });
    no.addEventListener("click", function () { t.remove(); onNo(); });
  }
  function restore() {
    var s = null;
    try { s = JSON.parse(sessionStorage.getItem(STASH) || "null"); } catch (e) {}
    if (!s || !s.edits || !s.edits.length) return;
    var todo = s.edits.filter(function (e) {
      var el = live[e.i];
      if (!el || clean(el) === e.html) return false; /* already live */
      return el.textContent === e.orig;               /* still the text that was edited */
    });
    if (!todo.length) {
      clearStash();
      if (s.pending) toast("Saved. Your changes are in index.html.");
      return;
    }
    offer(todo.length + (todo.length === 1 ? " unsaved edit" : " unsaved edits") + " from before the reload.",
      function () {
        enterEdit();
        todo.forEach(function (e) { live[e.i].innerHTML = e.html; dirty[e.i] = true; });
        refresh();
        stash(false);
      },
      clearStash);
  }

  if (!pairUp()) return;
  buildChrome();
  wire();
  restore();
})();
</script>
</body>
</html>
